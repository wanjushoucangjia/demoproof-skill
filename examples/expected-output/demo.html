<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Hello CLI demo</title><meta name="viewport" content="width=device-width, initial-scale=1"></head><body><svg xmlns="http://www.w3.org/2000/svg" width="900" height="196" viewBox="0 0 900 196" role="img" aria-label="Hello CLI demo">
<rect width="900" height="196" fill="#111827"/>
